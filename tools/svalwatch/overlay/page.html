<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="page.css">
  </head>
  <body>
    <div class="panel disconnected">
      <div class="breadcrumb">
        <span class="icon">&#xF030C;</span>
        <span class="layer-name">Svalboard disconnected</span>
        <span class="layer-variant"></span>
        <span class="spacer"></span>
        <span class="icon pin">&#xF0403;</span>
      </div>
      <hr class="separator">
      <div class="keyboard">
<!--LAYERS-->
      </div>
      <!-- The trackballs: each one's speed and mode under its own half.
           Hidden until the board reports them (firmware without the
           announcement's pointer line never does). -->
      <div class="pointers" hidden>
        <hr class="separator">
        <div class="footer">
          <div class="trackball" data-side="left">
            <span class="icon mode"></span>
            <span class="meter"></span>
            <span class="dpi"><b></b> dpi</span>
          </div>
          <div class="centre">
            <span class="factor" hidden><span class="icon factor-glyph"></span><span class="factor-text"></span></span>
            <span class="scroll-lock"><span class="icon">&#xF033E;</span> scroll lock</span>
          </div>
          <div class="trackball" data-side="right">
            <span class="dpi"><b></b> dpi</span>
            <span class="meter"></span>
            <span class="icon mode"></span>
          </div>
        </div>
      </div>
    </div>
    <!-- The held-key look, as an SVG filter: WebKit ignores CSS filter
         functions (brightness(), drop-shadow()) on elements inside an SVG,
         but applies filter: url(#pressed). Lifted toward white, ringed in
         which-key's key blue. -->
    <svg class="defs" width="0" height="0" aria-hidden="true">
      <filter id="pressed" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
        <feComponentTransfer in="SourceGraphic" result="lit">
          <feFuncR type="linear" slope="1.55"/>
          <feFuncG type="linear" slope="1.55"/>
          <feFuncB type="linear" slope="1.55"/>
        </feComponentTransfer>
        <feDropShadow in="lit" dx="0" dy="0" stdDeviation="8" flood-color="rgb(130, 170, 255)" flood-opacity="0.95"/>
      </filter>
    </svg>
    <script type="application/json" id="manifest"><!--MANIFEST--></script>
    <script src="page.js"></script>
  </body>
</html>
