name: Build Svalboard QMK firmware

on: [push, workflow_dispatch]

permissions:
    contents: write

env:
    # skim renders the overlay's layer images; 0.7.5 is the first with the
    # key tags and layer_indicator.reserve_space the overlay needs.
    SKIM_VERSION: "0.7.5"
    # The overlay header's icon font (Symbols Nerd Font Mono).
    NERD_FONTS_VERSION: "v3.4.0"

jobs:
    build:
        name: "Svalboard QMK Userspace Build"
        # Pinned, not ubuntu-latest: setup-python has no 3.9 build for
        # Ubuntu 26.04, and 3.9 is the version this build is tested with
        # (mise.toml). Svalboard's own CI builds on a newer Python inside
        # the qmk_cli container, so moving past 3.9 is an option.
        runs-on: ubuntu-24.04
        outputs:
            version: ${{ steps.version.outputs.version }}

        steps:
            - name: Set up Python 3.9
              uses: actions/setup-python@v7
              with:
                  python-version: '3.9'

            - name: Checkout userspace
              uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: Determine version from releases
              id: version
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # Read major.minor from VERSION file
                  BASE_VERSION=$(cat VERSION)

                  # Count existing releases matching this major.minor version
                  RELEASE_COUNT=$(gh release list --limit 1000 --json tagName --jq "[.[] | select(.tagName | startswith(\"v${BASE_VERSION}.\"))] | length")

                  # Patch number is count + 1 (first release will be .1)
                  PATCH=$((RELEASE_COUNT + 1))
                  BUILD_VERSION="${BASE_VERSION}.${PATCH}"

                  echo "version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
                  echo "Building version: ${BUILD_VERSION} (found ${RELEASE_COUNT} existing releases)"

            - name: Checkout Svalboard QMK
              uses: actions/checkout@v7
              with:
                  repository: svalboard/qmk
                  ref: svalboard
                  path: svalboard-qmk
                  submodules: recursive

            - name: Install QMK CLI and Svalboard QMK dependencies
              run: |
                  # The ARM toolchain, explicitly: vial-qmk's `qmk setup -y`
                  # apt-installed it, but the newer QMK in Svalboard's fork
                  # only reports it missing and carries on.
                  sudo apt-get update --quiet
                  sudo apt-get install --quiet --yes \
                      gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

                  python3 -m pip install --upgrade pip
                  python3 -m pip install qmk
                  python3 -m pip install -r svalboard-qmk/requirements.txt

                  qmk config user.qmk_home="$GITHUB_WORKSPACE/svalboard-qmk"
                  qmk config user.overlay_dir="$GITHUB_WORKSPACE"

                  qmk setup -y

            - name: Build firmware
              run: |
                  # Build each target from qmk.json
                  qmk userspace-compile

            - name: Rename firmware files
              run: |
                  VERSION="${{ steps.version.outputs.version }}"
                  mv svalboard_trackball_pmw3389_left_townk.uf2 "svalboard-colemak-dh-townk-${VERSION}.left.uf2"
                  mv svalboard_trackball_pmw3389_right_townk.uf2 "svalboard-colemak-dh-townk-${VERSION}.right.uf2"

            - name: Upload firmware artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: svalboard-colemak-townk
                  path: |
                      *.uf2
                      *.hex
                      *.bin
                  if-no-files-found: error

            # svaloverlay's page: skim's layer images in the overlay's
            # palette, built from the keymap with this job's QMK checkout.
            # Platform-independent, so it is built here and handed to the
            # macOS job that packs it with the binaries.
            - name: Build the overlay page
              run: |
                  python3 -m pip install --quiet uv
                  uv tool install --quiet "qmk-skim==${SKIM_VERSION}"

                  curl -fsSL "https://github.com/ryanoasis/nerd-fonts/releases/download/${NERD_FONTS_VERSION}/NerdFontsSymbolsOnly.tar.xz" \
                      | tar -xJ -C "$RUNNER_TEMP" SymbolsNerdFontMono-Regular.ttf

                  "$(uv tool dir)/qmk-skim/bin/python" tools/svalwatch/overlay/build_assets.py \
                      --repo "$GITHUB_WORKSPACE" \
                      --qmk-home "$GITHUB_WORKSPACE/svalboard-qmk" \
                      --icon-font "$RUNNER_TEMP/SymbolsNerdFontMono-Regular.ttf" \
                      --out overlay-page

            - name: Upload the overlay page
              uses: actions/upload-artifact@v7
              with:
                  name: svaloverlay-page
                  path: overlay-page/
                  if-no-files-found: error

    overlay:
        name: "Svalboard Overlay (macOS)"
        # Pinned for the same reason as the firmware runner; Xcode 16+ for
        # Swift 6 tools. The Intel image: twice in a row the Apple silicon
        # one (macos-15) sat queued and was cancelled -- "The job was not
        # acquired by Runner of type hosted even after multiple attempts",
        # GitHub citing arm64 capacity -- which skipped the release. Its
        # Xcode builds the same universal (arm64 + x86_64) binaries.
        runs-on: macos-15-intel
        needs: build

        steps:
            - name: Checkout userspace
              uses: actions/checkout@v7

            - name: Download the overlay page
              uses: actions/download-artifact@v8
              with:
                  name: svaloverlay-page
                  path: overlay-page

            - name: Test
              working-directory: tools/svalwatch
              run: swift test

            - name: Build svalwatch and svaloverlay
              working-directory: tools/svalwatch
              run: swift build -c release --arch arm64 --arch x86_64

            # One archive with a fixed name, so dotfiles can always fetch
            # releases/latest/download/svaloverlay-macos.tar.gz:
            #   svaloverlay, svalwatch    -> ~/.local/bin
            #   share/svaloverlay/...     -> ~/.local/share/svaloverlay
            # Ad-hoc signed (Apple silicon refuses unsigned code); files
            # fetched by a script carry no quarantine flag, so Gatekeeper
            # does not ask for a Developer ID.
            - name: Package
              run: |
                  BIN="$(cd tools/svalwatch && swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
                  mkdir -p pkg/share
                  cp "$BIN/svaloverlay" "$BIN/svalwatch" pkg/
                  codesign --force --sign - pkg/svaloverlay pkg/svalwatch
                  cp -R overlay-page pkg/share/svaloverlay
                  tar -czf svaloverlay-macos.tar.gz -C pkg .
                  tar -tzf svaloverlay-macos.tar.gz
                  lipo -archs pkg/svaloverlay

            - name: Upload the overlay
              uses: actions/upload-artifact@v7
              with:
                  name: svaloverlay-macos
                  path: svaloverlay-macos.tar.gz
                  if-no-files-found: error

    publish:
        name: "Publish Firmware"
        runs-on: ubuntu-latest
        # Only main may publish: a branch push would otherwise create a
        # non-draft release marked "latest" AND consume the next v1.0.N
        # patch number (the version is derived from the release count).
        if: success() && github.ref == 'refs/heads/main'
        needs: [build, overlay]

        steps:
            - name: Download firmware artifacts
              uses: actions/download-artifact@v8
              with:
                  name: svalboard-colemak-townk
                  path: firmware

            - name: Download the overlay
              uses: actions/download-artifact@v8
              with:
                  name: svaloverlay-macos
                  path: firmware

            - name: Create release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: v${{ needs.build.outputs.version }}
                  name: "Firmware v${{ needs.build.outputs.version }}"
                  body: |
                      Firmware build version ${{ needs.build.outputs.version }}

                      `svaloverlay-macos.tar.gz` is the matching layer overlay
                      (svaloverlay, svalwatch and the overlay page), for macOS.

                      **Branch:** ${{ github.ref_name }}
                      **Commit:** ${{ github.sha }}
                  files: firmware/*
                  draft: false
                  prerelease: false
